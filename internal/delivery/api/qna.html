<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q&A Board (Dev Mode)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .hidden { display: none; }
        .session-list, .question-list, .ws-messages { margin-bottom: 2em; }
        .session { cursor: pointer; color: blue; text-decoration: underline; }
        .selected { font-weight: bold; }
        .error { color: red; }
        .question { margin-bottom: 1em; }
        .ws-messages { background: #f9f9f9; border: 1px solid #ccc; padding: 1em; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <h1>Q&A Board <span style="color: #888; font-size: 0.5em;">(Dev Mode)</span></h1>
    <div id="nickname-section">
        <label>Enter your nickname (3-16 letters/numbers):
            <input type="text" id="nickname-input" maxlength="16" pattern="[A-Za-z0-9]{3,16}" required>
        </label>
        <button id="set-nickname-btn">Set Nickname</button>
        <span id="nickname-error" class="error"></span>
    </div>
    <div id="main-section" class="hidden">
        <div class="session-list">
            <h2>Sessions</h2>
            <ul id="sessions"></ul>
            <form id="new-session-form">
                <input type="text" id="new-session-title" placeholder="New session title" required maxlength="32">
                <button type="submit">Create Session</button>
            </form>
        </div>
        <div id="session-detail" class="hidden">
            <h2 id="session-title"></h2>
            <div class="question-list">
                <h3>Questions</h3>
                <ul id="questions"></ul>
            </div>
            <form id="question-form">
                <input type="text" id="question-text" placeholder="Your question" required maxlength="256">
                <button type="submit">Submit Question</button>
            </form>
            <button id="back-btn">Back to Sessions</button>
            <div class="ws-messages">
                <h3>WebSocket Messages</h3>
                <ul id="ws-messages-list"></ul>
            </div>
        </div>
    </div>
    <script>
    const apiBase = '/api/v1';
    let currentSessionId = null;
    let ws = null;
    let nickname = '';

    function validateNickname(nick) {
        return /^[A-Za-z0-9]{3,16}$/.test(nick);
    }

    document.getElementById('set-nickname-btn').onclick = function() {
        const input = document.getElementById('nickname-input');
        const error = document.getElementById('nickname-error');
        if (!validateNickname(input.value)) {
            error.textContent = 'Invalid nickname. Use 3-16 letters/numbers.';
            return;
        }
        nickname = input.value;
        error.textContent = '';
        document.getElementById('nickname-section').classList.add('hidden');
        document.getElementById('main-section').classList.remove('hidden');
        fetchSessions();
    };

    function fetchSessions() {
        fetch(`${apiBase}/sessions/`)
            .then(r => r.json())
            .then(data => {
                const sessions = data.data || [];
                const ul = document.getElementById('sessions');
                ul.innerHTML = '';
                sessions.forEach(s => {
                    const li = document.createElement('li');
                    li.textContent = s.title;
                    li.className = 'session';
                    li.onclick = () => joinSession(s.id, s.title);
                    ul.appendChild(li);
                });
            });
    }

    function joinSession(id, title) {
        currentSessionId = id;
        document.querySelector('.session-list').classList.add('hidden');
        document.getElementById('session-detail').classList.remove('hidden');
        document.getElementById('session-title').textContent = title;
        fetch(`${apiBase}/sessions/${id}`)
            .then(r => r.json())
            .then(data => {
                const questions = (data.data && data.data.questions) || [];
                const ul = document.getElementById('questions');
                ul.innerHTML = '';
                questions.forEach(q => {
                    const li = document.createElement('li');
                    li.className = 'question';
                    li.textContent = `${q.author_nickname || q.authorNickname}: ${q.text}`;
                    ul.appendChild(li);
                });
            });
        document.getElementById('ws-messages-list').innerHTML = '';
        connectWebSocket(id);
    }

    function addWsMessage(msg) {
        const ul = document.getElementById('ws-messages-list');
        const li = document.createElement('li');
        li.textContent = msg;
        ul.appendChild(li);
        ul.scrollTop = ul.scrollHeight;
    }

    function connectWebSocket(sessionId) {
        if (ws) ws.close();
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${protocol}://${window.location.host}/api/v1/sessions/${sessionId}/ws`);
        ws.onopen = () => addWsMessage('WebSocket connected');
        ws.onmessage = (event) => addWsMessage(event.data);
        ws.onclose = () => addWsMessage('WebSocket disconnected');
        ws.onerror = () => addWsMessage('WebSocket error');
    }

    function disconnectWebSocket() {
        if (ws) {
            ws.close();
            ws = null;
        }
    }

    document.getElementById('back-btn').onclick = function() {
        document.querySelector('.session-list').classList.remove('hidden');
        document.getElementById('session-detail').classList.add('hidden');
        currentSessionId = null;
        disconnectWebSocket();
    };

    document.getElementById('question-form').onsubmit = function(e) {
        e.preventDefault();
        const text = document.getElementById('question-text').value;
        if (!text.trim()) return;
        fetch(`${apiBase}/sessions/${currentSessionId}/questions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, nickname })
        })
        .then(r => r.json())
        .then(() => {
            document.getElementById('question-text').value = '';
        });
    };

    document.getElementById('new-session-form').onsubmit = function(e) {
        e.preventDefault();
        const title = document.getElementById('new-session-title').value;
        if (!title.trim()) return;
        fetch(`${apiBase}/sessions/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
        })
        .then(r => r.json())
        .then(() => {
            document.getElementById('new-session-title').value = '';
            fetchSessions();
        });
    };
    </script>
</body>
</html>
